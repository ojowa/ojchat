name: Mobile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ojchat-mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./ojchat-mobile/package-lock.json
      - run: npm install --legacy-peer-deps
      - name: Create .env from GitHub variables
        run: |
          cat > .env <<EOF
          PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}
          PUBLIC_WS_URL=${{ vars.PUBLIC_WS_URL }}
          PUBLIC_LOCAL_API_URL=http://YOUR_LAN_IP:3000/v1
          PUBLIC_LOCAL_WS_URL=http://YOUR_LAN_IP:3000
          EOF
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage

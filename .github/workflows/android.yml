name: Android Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ojchat-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./ojchat-mobile/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: ./ojchat-mobile/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ojchat-mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  build-aab:
    name: Build Android AAB
    runs-on: ubuntu-latest
    needs: build-apk
    defaults:
      run:
        working-directory: ./ojchat-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./ojchat-mobile/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Release AAB
        run: ./gradlew bundleRelease --no-daemon
        working-directory: ./ojchat-mobile/android

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: ojchat-mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  deploy-play-store:
    name: Deploy to Google Play
    runs-on: ubuntu-latest
    needs: build-aab
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab
          path: ./aab

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ojchatmobile
          releaseFiles: ./aab/app-release.aab
          track: production

name: iOS Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15
    defaults:
      run:
        working-directory: ./ojchat-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./ojchat-mobile/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install CocoaPods
        run: pod install
        working-directory: ./ojchat-mobile/ios
        env:
          NO_FLIPPER: '1'

      - name: Build iOS (Release, unsigned)
        run: |
          xcodebuild \
            -workspace TempRNApp73.xcworkspace \
            -scheme TempRNApp73 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: ./ojchat-mobile/ios

      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-build
          path: ojchat-mobile/ios/build/Build/Products/Release-iphoneos/ojchat-mobile.app
          if-no-files-found: error

  archive-and-deploy:
    name: Archive & Deploy to TestFlight
    runs-on: macos-15
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: ./ojchat-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./ojchat-mobile/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install CocoaPods
        run: pod install
        working-directory: ./ojchat-mobile/ios
        env:
          NO_FLIPPER: '1'

      - name: Import Code Signing Certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Download Provisioning Profile
        id: profiles
        uses: apple-actions/download-provisioning-profiles@v7
        with:
          bundle-id: 'com.ojchatmobile'
          profile-type: 'IOS_APP_STORE'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

      - name: Verify provisioning profile was found
        env:
          PROFILES: ${{ steps.profiles.outputs.profiles }}
        run: |
          if ! echo "$PROFILES" | grep -q 'com.ojchatmobile'; then
            echo "::error::No ACTIVE App Store provisioning profile for com.ojchatmobile"
            exit 1
          fi

      - name: Build Archive
        run: |
          xcodebuild \
            -workspace TempRNApp73.xcworkspace \
            -scheme TempRNApp73 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TempRNApp73.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=${{ secrets.IOS_DEVELOPMENT_TEAM }} \
            archive
        working-directory: ./ojchat-mobile/ios

      - name: Create ExportOptions.plist
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.IOS_DEVELOPMENT_TEAM }}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>upload</string>
          </dict>
          </plist>
          EOF
        working-directory: ./ojchat-mobile/ios

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/TempRNApp73.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist
        working-directory: ./ojchat-mobile/ios

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: ojchat-mobile/ios/build/ipa/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          printf '%s' "$API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun altool --upload-app \
            -f build/ipa/*.ipa \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID" \
            --apiKeyPath "$RUNNER_TEMP/AuthKey.p8"
        working-directory: ./ojchat-mobile/ios

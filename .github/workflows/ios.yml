name: iOS Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14
    defaults:
      run:
        working-directory: ./ojchat-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./ojchat-mobile/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install CocoaPods
        run: pod install
        working-directory: ./ojchat-mobile/ios
        env:
          NO_FLIPPER: '1'

      - name: Build iOS (Release, unsigned)
        run: |
          xcodebuild \
            -workspace TempRNApp73.xcworkspace \
            -scheme TempRNApp73 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: ./ojchat-mobile/ios

      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-build
          path: ojchat-mobile/ios/build/Build/Products/Release-iphoneos/TempRNApp73.app
          if-no-files-found: error

  archive-and-deploy:
    name: Archive & Deploy to TestFlight
    runs-on: macos-14
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: ./ojchat-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./ojchat-mobile/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install CocoaPods
        run: pod install
        working-directory: ./ojchat-mobile/ios
        env:
          NO_FLIPPER: '1'

      - name: Import Code Signing Certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Import Provisioning Profile
        uses: apple-actions/import-provisioning-profile@v1
        with:
          profile-data-base64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          mobileprovision-filename: AppStore.mobileprovision

      - name: Build Archive
        run: |
          xcodebuild \
            -workspace TempRNApp73.xcworkspace \
            -scheme TempRNApp73 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TempRNApp73.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=${{ secrets.IOS_DEVELOPMENT_TEAM }} \
            archive
        working-directory: ./ojchat-mobile/ios

      - name: Create ExportOptions.plist
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.IOS_DEVELOPMENT_TEAM }}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>upload</string>
          </dict>
          </plist>
          EOF
        working-directory: ./ojchat-mobile/ios

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/TempRNApp73.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist
        working-directory: ./ojchat-mobile/ios

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: ojchat-mobile/ios/build/ipa/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            -f build/ipa/*.ipa \
            -t ios \
            --apiKey ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }} \
            --apiKeyPath ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_PATH }}
        working-directory: ./ojchat-mobile/ios
